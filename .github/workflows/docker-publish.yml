# Сборка и публикация Docker-образа в GitHub Container Registry или другой registry.
# Активируется при push тега v* или вручную (workflow_dispatch).
#
# Секреты репозитория:
#   REGISTRY          — URL registry (например ghcr.io или registry.example.com)
#   REGISTRY_USER     — имя пользователя
#   REGISTRY_PASSWORD — токен или пароль
#
# Переменные (опционально):
#   IMAGE_NAME        — по умолчанию al-web-video-encoder

name: Docker Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Тег образа'
        required: false
        default: 'latest'

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Resolve image name and tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="latest"
          fi
          NAME="${{ vars.IMAGE_NAME }}"
          if [ -z "$NAME" ]; then NAME="al-web-video-encoder"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${{ secrets.REGISTRY }}/${NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build metadata
        id: buildmeta
        run: |
          echo "build_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          echo "git_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          platforms: linux/amd64,linux/arm64/v8
          provenance: false
          sbom: false
          build-args: |
            BUILD_TIME=${{ steps.buildmeta.outputs.build_time }}
            GIT_SHA=${{ steps.buildmeta.outputs.git_sha }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
