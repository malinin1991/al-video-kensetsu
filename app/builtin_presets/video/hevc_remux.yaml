# video preset
# нет необязательного ключа → флаг в ffmpeg не передаётся
# video_map: нет ключа → fallback -map 0:v:0? (иначе другие -map съедят видео)
# default: true — ровно у одного video-пресета

# --- обязательно ---
id: hevc_remux
name: HEVC remux
video_codec: libx265
output_format: matroska

# --- необязательно ---
description: Blu-ray remux quality — libx265 CRF 21 slower
default: false
preset: slower
crf: "21"
pixel_format: yuv420p10le
x265_params: level=5.1:ref=6
tune: animation
video_map: 0:v:0
