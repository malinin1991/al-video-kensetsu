services:
  video-encoder:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_TIME: ${BUILD_TIME:-unknown}
        GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "3000:5000"
    volumes:
      - uploads:/app/uploads
      # Хранилище исходников для внутреннего режима (раскомментируйте):
      # - /mnt/user/anilibria:/anilibria:ro
      # Папка для готовых копий (запись); также задайте INTERNAL_OUTPUT_ROOTS=/exports:
      # - /mnt/user/anilibria-encoded:/exports
      - outputs:/app/outputs
      - logs:/app/logs
      - settings:/app/settings
      - data:/app/data
      - ffmpeg_bin:/app/ffmpeg
      # Свои ffmpeg/ffprobe: положите bin/ffmpeg и bin/ffprobe в каталог и раскомментируйте:
      # - /mnt/user/appdata/al-web-video-encoder/ffmpeg:/app/ffmpeg
      # Bind-mount на диск хоста (раскомментируйте и закомментируйте named volumes выше):
      # - ./data/uploads:/app/uploads
      # - ./data/outputs:/app/outputs
      # - ./data/logs:/app/logs
      # - ./data/settings:/app/settings
      # - ./data/appdata:/app/data
      - ./presets:/app/presets
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - FLASK_ENV=development
      - PYTHONPATH=/app
      - FFMPEG_DIR=/app/ffmpeg
      # Опционально, если mkvmerge не в PATH: MKVMERGE_BIN=/usr/bin/mkvmerge
      - FFMPEG_THREAD_QUEUE_SIZE=1024
      - MAX_CONCURRENT_ENCODES=1
      - LOG_LEVEL=INFO
      - CONSOLE_LOG_LEVEL=INFO
      - TZ=Asia/Novosibirsk
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://172.18.0.1:3000,http://pc13.local:3000,http://*.local:3000
      - SOCKETIO_ASYNC_MODE=threading
      - INTERNAL_SOURCE_ROOTS=/anilibria
      - INTERNAL_OUTPUT_ROOTS=${INTERNAL_OUTPUT_ROOTS-/anilibria}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  uploads:
  outputs:
  logs:
  settings:
  data:
  ffmpeg_bin:
